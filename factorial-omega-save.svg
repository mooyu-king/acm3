<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Keep your checkpoint</title><rect width="800" height="450" fill="#10152a"/><rect x="26" y="24" width="748" height="402" rx="22" fill="#18213a" stroke="#c6b6ff" stroke-width="2"/><text x="56" y="68" fill="#c6b6ff" font-family="sans-serif" font-size="15" letter-spacing="4">INTERFACE GUIDE / 03</text><text x="56" y="125" fill="#fff" font-family="sans-serif" font-size="37" font-weight="700">Keep your checkpoint</text><rect x="56" y="155" width="688" height="60" rx="9" fill="#24314f"/><circle cx="82" cy="185" r="7" fill="#c6b6ff"/><text x="105" y="191" fill="#fff" font-family="sans-serif" font-weight="700" font-size="21">Game menu</text><text x="345" y="191" fill="#c9d8f7" font-family="sans-serif" font-size="18">Open pause controls</text><rect x="56" y="232" width="688" height="60" rx="9" fill="#24314f"/><circle cx="82" cy="262" r="7" fill="#c6b6ff"/><text x="105" y="268" fill="#fff" font-family="sans-serif" font-weight="700" font-size="21">Save progress</text><text x="345" y="268" fill="#c9d8f7" font-family="sans-serif" font-size="18">Store the run in this browser</text><rect x="56" y="309" width="688" height="60" rx="9" fill="#24314f"/><circle cx="82" cy="339" r="7" fill="#c6b6ff"/><text x="105" y="345" fill="#fff" font-family="sans-serif" font-weight="700" font-size="21">Continue</text><text x="345" y="345" fill="#c9d8f7" font-family="sans-serif" font-size="18">Resume from the game menu</text></svg>
